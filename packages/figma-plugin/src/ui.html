<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, sans-serif; }
    body { padding: 20px; background: #fff; color: #111; }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    p  { font-size: 12px; color: #666; margin-bottom: 20px; line-height: 1.5; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #18a0fb; color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover  { background: #0d8ce0; }
    button:active { background: #0a7bc7; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 14px; font-size: 12px; color: #555; text-align: center;
      min-height: 18px;
    }
    .progress {
      margin-top: 8px; height: 4px; border-radius: 2px; background: #eee; overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: #18a0fb; width: 0%; transition: width 0.2s;
    }
  </style>
  <!-- JSZip for ZIP assembly in the browser sandbox -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <h2>AppVelocity Exporter</h2>
  <p>Exports the current page as a ZIP file containing design data and all image assets. Upload it to AppVelocity instead of pasting a Figma URL.</p>
  <button id="exportBtn">Export for AppVelocity</button>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div id="status"></div>

  <script>
    const btn         = document.getElementById('exportBtn');
    const statusEl    = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');

    btn.addEventListener('click', () => {
      btn.disabled = true;
      statusEl.textContent = 'Scanning design…';
      parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
    });

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'progress') {
        const pct = Math.round((msg.current / msg.total) * 100);
        progressBar.style.width = pct + '%';
        statusEl.textContent = `Exporting… ${msg.current}/${msg.total} nodes`;
        return;
      }

      if (msg.type === 'status') {
        statusEl.textContent = msg.text;
        return;
      }

      if (msg.type === 'done') {
        statusEl.textContent = 'Building ZIP…';
        progressBar.style.width = '95%';

        const zip = new JSZip();

        // Add the JSON
        zip.file('figma-export.json', JSON.stringify(msg.exportJson, null, 2));

        // Add asset PNGs
        const assetsFolder = zip.folder('assets');
        for (const asset of msg.assetFiles) {
          const uint8 = new Uint8Array(asset.bytes);
          assetsFolder.file(asset.fileName, uint8, { binary: true });
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        const url  = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href     = url;
        a.download = `appvelocity-export.zip`;
        a.click();
        URL.revokeObjectURL(url);

        progressBar.style.width = '100%';
        const screens = msg.screenCount ?? '?';
        const assets  = msg.assetFiles.length;
        statusEl.textContent = `Done! ${screens} screens, ${assets} assets exported.`;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
